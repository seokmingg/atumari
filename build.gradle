plugins {
	id 'java'
	id 'war'
	id 'eclipse-wtp'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'atumari'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Eclipse가 이 프로젝트를 구형 javax.servlet 기반 웹 프로젝트로 인식하지 않도록 설정합니다.
eclipse {
	wtp {
		facet {
			facet name: 'jst.web', version: '6.0'
			facet name: 'jst.java', version: '21'
		}
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ==================================================
	// 데이터베이스
	// ==================================================

	// JPA와 Hibernate를 이용해 객체와 데이터베이스 테이블을 연결
	// JpaRepository, @Entity, @OneToMany 등을 사용할 때 필요
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// SQL을 직접 작성하기 위한 JDBC 기능
	// JdbcTemplate, NamedParameterJdbcTemplate 등을 제공
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// MySQL 데이터베이스 연결을 위한 JDBC 드라이버
	// 애플리케이션 실행 시에만 필요
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 회원 비밀번호를 평문으로 저장하지 않고 BCrypt로 해시할 때 사용
	implementation 'at.favre.lib:bcrypt:0.10.2'

	// com.fasterxml.jackson.databind.ObjectMapper를 사용하기 위한 Jackson 2
	// JSON 문자열과 Java DTO를 서로 변환할 때 사용
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'


	// ==================================================
	// 인증 및 보안
	// ==================================================

	// 로그인, 로그아웃, 세션, 권한 및 접근 제어 기능 제공
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Google 로그인 등 OAuth2 / OpenID Connect 로그인 구현에 사용
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'


	// ==================================================
	// 웹 및 입력값 검증
	// ==================================================

	// Spring MVC 기반 웹 애플리케이션 개발에 사용
	// Controller, REST API, 내장 Tomcat 등의 기능 제공
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// 요청 데이터 검증에 사용
	// @NotBlank, @Email, @Size, @Pattern 등의 어노테이션 제공
	implementation 'org.springframework.boot:spring-boot-starter-validation'


	// ==================================================
	// JSP
	// ==================================================

	// JSP 파일을 Java Servlet으로 변환하고 실행하는 Jasper 엔진
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'

	// JSTL 태그 사용을 위한 API
	// 예: <c:if>, <c:forEach>, <fmt:formatDate>
	implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api'

	// JSTL API의 실제 구현체
	implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl'

	// WAR로 패키징할 때 Tomcat을 provided 의존성으로 포함
	// 외부 Tomcat 배포와 java -jar 방식의 실행 가능한 WAR를 지원
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'


	// ==================================================
	// 테스트
	// ==================================================

	// JPA Repository와 엔티티 관련 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

	// JdbcTemplate 및 JDBC Repository 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'

	// OAuth2 로그인 관련 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'

	// 인증 사용자, 권한 검사 등 Spring Security 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// Bean Validation 관련 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'

	// Controller 및 Spring MVC 관련 테스트 지원
	// MockMvc를 이용한 요청과 응답 테스트에 사용
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// JUnit 테스트 실행 엔진
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
