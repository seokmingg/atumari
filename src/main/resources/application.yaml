spring:
  application:
    name: atumari

  # ==========================================
  # 로컬 .env 파일 불러오기
  # ==========================================
  config:
    import: optional:file:./.env[.properties]

  # ==========================================
  # JSP
  # ==========================================
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # ==========================================
  # Database
  # ==========================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==========================================
  # JPA / Hibernate
  # ==========================================
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}

    show-sql: ${SHOW_SQL:true}

    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  # ==========================================
  # Google OAuth2
  # ==========================================
#  security:
#    oauth2:
#      client:
#        registration:
#          google:
#            client-id: ${GOOGLE_CLIENT_ID}
#            client-secret: ${GOOGLE_CLIENT_SECRET}
#            scope:
#              - openid
#              - profile
#              - email

server:
  port: ${SERVER_PORT:8080}

atumari:
  database:
    server-url: ${DB_SERVER_URL:jdbc:mysql://localhost:3306/}

logging:
  level:
    root: INFO
    atumari: DEBUG
