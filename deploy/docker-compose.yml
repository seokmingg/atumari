name: atumari

services:
  spring:
    image: ${SPRING_IMAGE}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/spring/Dockerfile
    env_file:
      - .env
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - atumari-network

  nginx:
    image: ${NGINX_IMAGE}:${IMAGE_TAG:-latest}
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      - spring
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - atumari-network

  certbot:
    image: certbot/certbot:latest
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      DOMAIN: ${DOMAIN:-atumary.com}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh
    command: >-
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h;
      done"
    restart: unless-stopped

networks:
  atumari-network:
    driver: bridge
